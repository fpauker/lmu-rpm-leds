<!-- A rev-light bar: the thing this program actually lights up. Segments run
     green through amber to red, with the last two dark so the icon reads as a
     bar in motion rather than a solid block. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f58"/>
      <stop offset="1" stop-color="#23272e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- wheel rim segment the LEDs sit in -->
  <rect x="8" y="34" width="112" height="60" rx="16" fill="url(#rim)"/>
  <rect x="8" y="34" width="112" height="60" rx="16" fill="none"
        stroke="#12151a" stroke-width="2"/>

  <!-- the bar: eight lit segments, two dark -->
  <g filter="url(#glow)">
    <rect x="19"  y="52" width="8" height="24" rx="3" fill="#2ad855"/>
    <rect x="31"  y="52" width="8" height="24" rx="3" fill="#2ad855"/>
    <rect x="43"  y="52" width="8" height="24" rx="3" fill="#2ad855"/>
    <rect x="55"  y="52" width="8" height="24" rx="3" fill="#8ede2b"/>
    <rect x="67"  y="52" width="8" height="24" rx="3" fill="#ffc21a"/>
    <rect x="79"  y="52" width="8" height="24" rx="3" fill="#ffc21a"/>
    <rect x="91"  y="52" width="8" height="24" rx="3" fill="#ff5c3d"/>
    <rect x="103" y="52" width="8" height="24" rx="3" fill="#ff3838"/>
  </g>
</svg>
